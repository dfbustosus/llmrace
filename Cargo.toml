[package]
name = "llmrace"
version = "1.3.0"
edition = "2021"
rust-version = "1.88"
description = "Race LLM providers head-to-head in your terminal: latency, TTFB, tokens/s, p95 and cost — live."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dfbustosus/llmrace"
homepage = "https://github.com/dfbustosus/llmrace"
readme = "README.md"
keywords = ["llm", "ai", "benchmark", "cli", "openai"]
categories = ["command-line-utilities", "development-tools"]

# Policy (README "Stability"): new struct fields arrive additively in
# minors — exhaustive literals in downstream code are the known trade-off.
# Everything else (removed items, signature changes) stays deny.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = { level = "warn", required-update = "minor" }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = []
## SQLite storage backend for history (`--storage sqlite`)
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.42", optional = true, features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
anyhow = "1"
thiserror = "2"
toml = "1.2"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "sse"
harness = false

[profile.release]
lto = true
strip = true
