name: MSRV

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV ${{ matrix.toolchain }} (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: "1.88.0"
            features: ""
          - toolchain: "1.89.0"
            features: "sqlite"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --features "${{ matrix.features }}"
