name: Distributed probe

# Reusable latency probe: runs llmrace on this runner and uploads the JSON
# report as an artifact so results from multiple regions can be merged into
# one history. Use from this repo or any workflow that references it:
#
#   jobs:
#     probe:
#       uses: dfbustosus/llmrace/.github/workflows/probe.yml@main
#       with:
#         providers: groq openai
#       secrets:
#         GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

on:
  workflow_call:
    inputs:
      providers:
        description: Space-separated provider ids to race
        required: false
        type: string
        default: "groq openai"
      runs:
        description: Measured rounds per provider
        required: false
        type: number
        default: 3
    secrets:
      GROQ_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      TOGETHER_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      providers:
        description: Space-separated provider ids to race
        required: false
        default: "groq openai"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: llmrace probe (${{ inputs.providers || 'groq openai' }})
    runs-on: ubuntu-latest
    steps:
      - name: Install llmrace
        uses: taiki-e/install-action@cargo-binstall
        with:
          tool: llmrace

      - name: Record region metadata
        id: meta
        run: |
          set -euo pipefail
          raw="$(curl -sf --max-time 5 https://ipinfo.io/region || true)"
          region="$(printf '%s' "$raw" | tr -cd 'A-Za-z0-9._-')"
          region="${region:0:64}"
          region="${region:-unknown}"
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - name: Race providers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          PROVIDERS: ${{ inputs.providers || 'groq openai' }}
          RUNS: ${{ inputs.runs || 3 }}
          REGION: ${{ steps.meta.outputs.region }}
        run: |
          set -euo pipefail
          provider_pattern='^[A-Za-z0-9_.,=/: -]+$'
          if [[ ! "$PROVIDERS" =~ $provider_pattern ]]; then
            echo "Invalid providers input" >&2
            exit 1
          fi
          read -r -a provider_args <<< "$PROVIDERS"
          if [[ "${#provider_args[@]}" -eq 0 ]]; then
            echo "No providers specified" >&2
            exit 1
          fi
          for provider in "${provider_args[@]}"; do
            if [[ "$provider" == -* ]]; then
              echo "Invalid provider token: $provider" >&2
              exit 1
            fi
          done
          if [[ ! "$RUNS" =~ ^[0-9]+$ ]]; then
            echo "Invalid runs input" >&2
            exit 1
          fi
          llmrace "${provider_args[@]}" \
            -n "$RUNS" --warmup 1 \
            --region "$REGION" \
            --json --out "probe-${REGION}.json"

      - name: Upload probe report
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ steps.meta.outputs.region }}
          path: probe-*.json
          if-no-files-found: error
