name: Distributed probe

# Reusable latency probe: runs llmrace on this runner and uploads the JSON
# report as an artifact so results from multiple regions can be merged into
# one history. Use from this repo or any workflow that references it:
#
#   jobs:
#     probe:
#       uses: dfbustosus/llmrace/.github/workflows/probe.yml@main
#       with:
#         providers: groq openai
#       secrets:
#         GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

on:
  workflow_call:
    inputs:
      providers:
        description: Space-separated provider ids to race
        required: false
        type: string
        default: "groq openai"
      runs:
        description: Measured rounds per provider
        required: false
        type: number
        default: 3
    secrets:
      GROQ_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      TOGETHER_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      providers:
        description: Space-separated provider ids to race
        required: false
        default: "groq openai"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: llmrace probe (${{ inputs.providers || 'groq openai' }})
    runs-on: ubuntu-latest
    steps:
      - name: Install llmrace
        uses: taiki-e/install-action@cargo-binstall
        with:
          tool: llmrace

      - name: Record region metadata
        run: |
          echo "region=$(curl -sf https://ipinfo.io/region || echo unknown)" >> "$GITHUB_OUTPUT"
        id: meta

      - name: Race providers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          llmrace ${{ inputs.providers || 'groq openai' }} \
            -n "${{ inputs.runs || 3 }}" --warmup 1 \
            --json --out "probe-${{ steps.meta.outputs.region }}.json"

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ steps.meta.outputs.region }}
          path: probe-*.json
          if-no-files-found: error
