name: Docker

# Builds and pushes llmrace images to ghcr.io after each release.
# Two variants, each multi-arch:
#   ghcr.io/dfbustosus/llmrace          — ubuntu 24.04, glibc (tag: latest, X.Y.Z)
#   ghcr.io/dfbustosus/llmrace-scratch  — FROM scratch + musl, ~3 MB (tag: scratch, X.Y.Z)

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "llmrace version to package (defaults to the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            dockerfile: docker/Dockerfile
            variant: main
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            dockerfile: docker/Dockerfile
            variant: main
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            dockerfile: docker/Dockerfile.scratch
            variant: scratch
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            dockerfile: docker/Dockerfile.scratch
            variant: scratch
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r .tag_name)"
            v="${v#v}"
          fi
          [ -n "$v" ] || { echo "could not resolve version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name for variant
        id: img
        run: |
          base="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ matrix.variant }}" = "scratch" ]; then
            echo "name=${base}-scratch" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            TARGET=${{ matrix.target }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: build-push
    strategy:
      matrix:
        variant: [main, scratch]
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name for variant
        id: img
        run: |
          base="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ matrix.variant }}" = "scratch" ]; then
            echo "name=${base}-scratch" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r .tag_name)"
          v="${v#v}"
          [ -n "$v" ] || exit 1
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Merge into multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.img.outputs.name }}"
          V="${{ steps.ver.outputs.version }}"
          if [ "${{ matrix.variant }}" = "scratch" ]; then
            tags=("$V" "${V%.*}" "scratch")
          else
            tags=("$V" "${V%.*}" "latest")
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create \
              $(printf "$IMAGE@sha256:%s " *) --tag "$IMAGE:$tag"
          done
