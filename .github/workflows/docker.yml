name: Docker

# Builds and pushes llmrace images to ghcr.io after each release.
# Two variants, each multi-arch:
#   ghcr.io/dfbustosus/llmrace          — ubuntu 24.04, glibc (tag: latest, X.Y.Z)
#   ghcr.io/dfbustosus/llmrace-scratch  — FROM scratch + musl, ~3 MB (tag: scratch, X.Y.Z)

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "llmrace version to package (defaults to the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_aliases: ${{ steps.version.outputs.publish_aliases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve the release once
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            v="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          else
            v="${REQUESTED_VERSION:-$latest}"
            v="${v#v}"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$v" --json tagName > /dev/null
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "v$v" = "$latest" ]; then
            echo "publish_aliases=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_aliases=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            dockerfile: docker/Dockerfile
            variant: main
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            dockerfile: docker/Dockerfile
            variant: main
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            dockerfile: docker/Dockerfile.scratch
            variant: scratch
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            dockerfile: docker/Dockerfile.scratch
            variant: scratch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name for variant
        id: img
        run: |
          base="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ matrix.variant }}" = "scratch" ]; then
            echo "name=${base}-scratch" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            TARGET=${{ matrix.target }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Scan the immutable image before publishing version tags
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: [resolve, build-push]
    strategy:
      matrix:
        variant: [main, scratch]
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name for variant
        id: img
        run: |
          base="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ matrix.variant }}" = "scratch" ]; then
            echo "name=${base}-scratch" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Merge into multi-arch manifest
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PUBLISH_ALIASES: ${{ needs.resolve.outputs.publish_aliases }}
        run: |
          IMAGE="${{ steps.img.outputs.name }}"
          V="$VERSION"
          tags=("$V")
          if [ "$PUBLISH_ALIASES" = true ]; then
            if [ "${{ matrix.variant }}" = "scratch" ]; then
              tags+=("${V%.*}" "scratch")
            else
              tags+=("${V%.*}" "latest")
            fi
          fi
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          for tag in "${tags[@]}"; do
            docker buildx imagetools create \
              "${sources[@]}" --tag "$IMAGE:$tag"
          done
