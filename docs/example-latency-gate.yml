# Example: llmrace as a CI latency gate.
#
# Copy into .github/workflows/latency.yml of any project. It records a
# baseline once (committed to the repo), then fails the pipeline only when
# a provider regresses beyond the threshold AND the difference is
# statistically significant (--require-significance) — flaky thresholds
# over noise do not fail builds.

name: Latency gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install llmrace
        uses: taiki-e/install-action@cargo-binstall
        with:
          tool: llmrace

      # Record the baseline with:
      #   llmrace openai groq -n 10 --warmup 2 --json --out baseline/llmrace-report.json
      # …then commit baseline/llmrace-report.json to the repository.

      - name: Race and gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          llmrace openai groq \
            -n 10 --warmup 2 --retries 2 \
            --baseline baseline/llmrace-report.json \
            --max-regression 15 \
            --require-significance \
            --out llmrace-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llmrace-report
          path: |
            llmrace-report.md
            llmrace-report.json
