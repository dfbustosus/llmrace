# Example: llmrace as a CI race gate.
#
# Copy into .github/workflows/llmrace.yml of any project. It records a
# baseline once (committed to the repo), then fails the pipeline when a
# provider regresses beyond the threshold. Latency and tokens/s also require
# a significant difference (--require-significance). Failure rate, goodput,
# cost and task success are ratios of the whole sample, so a threshold
# breach on those fails the build without a t-test.

name: Race gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install llmrace
        uses: taiki-e/install-action@cargo-binstall
        with:
          tool: llmrace

      # Record the baseline with:
      #   llmrace openai groq -n 10 --warmup 2 --retries 2 \
      #     --workload examples/workloads/short-answer.jsonl \
      #     --json --out baseline/llmrace-report.md
      # …then commit baseline/llmrace-report.json to the repository.
      # --json writes the sibling llmrace-report.json next to --out.
      # That JSON has regression.failures[].prompt_id when the gate fails.

      - name: Race and gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          llmrace openai groq \
            -n 10 --warmup 2 --retries 2 \
            --workload examples/workloads/short-answer.jsonl \
            --baseline baseline/llmrace-report.json \
            --max-regression 15 \
            --require-significance \
            --json \
            --out llmrace-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llmrace-report
          path: |
            llmrace-report.md
            llmrace-report.json
